// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "34"
        minSdkVersion = 24
        compileSdkVersion = 34
        targetSdkVersion = 34
        // We use NDK 23 which has both M1 support and is the side-by-side NDK version from AGP.
        ndkVersion = "23.1.7779620"
        kotlinVersion = "1.9.22"
        googlePlayServicesVersion = "16.0.1"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

allprojects {
  configurations.all {
    resolutionStrategy {
      force 'androidx.fragment:fragment:1.6.1' 
    }
     resolutionStrategy{
      force "com.google.android.gms:play-services-analytics:16.0.1"
      force "com.google.android.gms:play-services-tagmanager-v4-impl:16.0.1"
				// react-native-device-info
        force "com.google.android.gms:play-services-gcm:15.0.0"
     }
       
  }
}